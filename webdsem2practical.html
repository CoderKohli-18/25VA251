<!DOCTYPE html>
<html>
<head>
<title>Reverse Number</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial;
        background: #f2f2f2;
    }

    .box {
        background: white;
        padding: 25px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        width: 280px;
    }

    input {
        padding: 10px;
        width: 90%;
        margin: 10px 0;
        font-size: 16px;
    }

    button {
        padding: 10px 15px;
        cursor: pointer;
        font-size: 16px;
    }

    #result {
        margin-top: 15px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="box">
    <h2>Reverse Number</h2>

    <input id="num" placeholder="Enter number">

    <br>

    <button onclick="reverseNumber()">Reverse</button>

    <p id="result"></p>
</div>

<script>
function reverseNumber() {
    let n = document.getElementById("num").value;
    let r = document.getElementById("result");

    if (n === "") {
        r.textContent = "Enter a number";
        return;
    }

    let reversed = n.split("").reverse().join("");
    r.textContent = "Reversed: " + reversed;
}
</script>

</body>
</html>
